# Dependency updates arrive as PRs, and CI's `make check` vets each one.
#
# Not covered here: the Node and Python base image (Containerfile takes
# NODE_VERSION from .node-version, which Dependabot cannot follow) and the
# pinned tool images in the Makefile (actionlint, the .NET SDK), and OpenTofu in
# the Containerfile. Bump those by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    groups:
      # aws-cdk-lib bundles its own dependencies (minimatch, brace-expansion…), so
      # a security fix inside it only ever arrives as an aws-cdk-lib release.
      cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
      test-tooling:
        patterns: ["jest", "ts-jest", "@types/*", "ts-node", "typescript"]

  # A provider bump changes the provider version in cdktn/terraform/*/versions.tf, so
  # its PR fails `make cdktn-check` until someone runs `make cdktn-synth tofu-lock`
  # and commits: on purpose, since that is the change Terraform users will apply.
  # (No `terraform` ecosystem: the HCL is generated, and is bumped from here.)
  - package-ecosystem: npm
    directory: /cdktn
    schedule:
      interval: weekly
    groups:
      cdktn:
        patterns: ["cdktn", "@cdktn/*", "constructs"]
      test-tooling:
        patterns: ["jest", "ts-jest", "@types/*", "ts-node", "typescript"]
    ignore:
      # cdktn 0.24 requires constructs >=10.6.0 <10.8.0. Drop this when a cdktn
      # release widens it; the cdktn group then brings constructs along.
      - dependency-name: constructs
        versions: [">=10.8.0"]

  - package-ecosystem: pip
    directory: /harness
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /image/flaui-mcp-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # desktop-uat.yml runs on GHES, which does not support upload-artifact@v4+.
      # (This also holds ci.yml's copy at its current major; bump that by hand.)
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
