name: CI

# The same `make check` as a laptop, with Docker standing in for Apple `container`.
# Nothing here touches AWS: the CDK synthesizes offline, and the harness and the
# scripts run against fakes (see AGENTS.md, "What is mocked").
#
# Then the one thing no container can do: the real FlaUI MCP server driving the real
# example app on a Windows desktop, from the very zips the check job built.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTAINER_BIN: docker
      START: "true"
      RESOURCES: ""
    steps:
      - uses: actions/checkout@v7

      - name: Build the dev image
        run: make image

      - name: make check
        run: make check

      # example-build already ran inside `check`; add the server.
      - name: Package the FlaUI server
        run: make flaui-zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: FlaUI live (Windows)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The EC2 image's scripts (image/ec2/), in the Windows PowerShell 5.1 the
      # instances run. What needs an instance (domain join, autologon, SSM) cannot
      # be tested here.
      - name: Pester (EC2 image scripts)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path image/ec2/tests -CI

      - uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Harness dependencies
        run: python -m pip install --quiet -r harness/requirements-dev.txt

      - name: Unpack the FlaUI server
        shell: pwsh
        run: Expand-Archive -Path dist\flaui-mcp-server.zip -DestinationPath "$env:RUNNER_TEMP\flaui"

      # install_build only downloads over HTTPS from an allow-listed host. The test
      # serves the zip from localhost, so the machine has to trust a localhost cert.
      - name: Localhost certificate
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"   # keep Git Bash from rewriting /CN=... into a path
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"

      - name: Trust it
        shell: pwsh
        run: Import-Certificate -FilePath "$env:RUNNER_TEMP\cert.pem" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null

      - name: FlaUI against UAT Demo
        shell: bash
        run: |
          export FLAUI_SERVER_ZIP="$GITHUB_WORKSPACE/dist/flaui-mcp-server.zip"
          version=$(tr -d '\r\n' < example-app/VERSION)
          export UAT_DEMO_ZIP="$GITHUB_WORKSPACE/dist/uat-demo-$version.zip"
          export UAT_TLS_CERT="$RUNNER_TEMP/cert.pem" UAT_TLS_KEY="$RUNNER_TEMP/key.pem"
          python -m pytest tests/windows -v -p no:cacheprovider

      # The worked scenario, end to end, as a UAT run without AWS: the harness installs
      # and launches UAT Demo, its walkthrough drives it, screenshots are taken at each
      # step, deterministic criteria are judged. Visual criteria await review.
      - name: UAT walkthrough (no agent)
        id: walkthrough
        if: success() || failure()
        shell: bash
        working-directory: harness
        run: |
          version=$(tr -d '\r\n' < ../example-app/VERSION)
          python -m uat_harness.cli local \
            --scenarios scenarios \
            --flaui-server "$RUNNER_TEMP/flaui/FlaUiMcpServer.exe" \
            --allowed-hosts localhost \
            --state-root '%APPDATA%\UatDemo' \
            --log-root "$RUNNER_TEMP/uat-logs" \
            --build-file "../dist/uat-demo-$version.zip" \
            --tls-cert "$RUNNER_TEMP/cert.pem" --tls-key "$RUNNER_TEMP/key.pem" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --git-ref "$GITHUB_REF" --git-sha "$GITHUB_SHA" \
            --out ../reports

      - name: Job summary
        if: always() && steps.walkthrough.outcome != 'skipped'
        shell: bash
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No UAT report was produced; see the step log." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the UAT report
        id: report
        if: always() && steps.walkthrough.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: uat-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      # Screenshots cannot be inlined in a job summary (no data: URIs, and artifact
      # URLs need a login), so the summary links straight to the artifact; its
      # report.html has every screenshot embedded.
      - name: Link the report from the summary
        if: always() && steps.report.outputs.artifact-url != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "**[Download the UAT report]($ARTIFACT_URL)**: unzip it and open \`report.html\` to see every screenshot."
          } >> "$GITHUB_STEP_SUMMARY"

      # A failing UI test is far easier to read with a picture of the desktop.
      - name: Screenshot on failure
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\desktop.png")

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-failure
          path: ${{ runner.temp }}/desktop.png
          if-no-files-found: ignore
