# The worked example. It targets the example app in example-app/ (UAT Demo), so it runs
# as written. For your own app, copy it and replace the AutomationIds, paths and text.
#
# Its deterministic criteria are also run, for real, against UAT Demo by
# tests/windows/test_flaui_live.py, so they are known to hold.
id: smoke-login
title: Launch, sign in with test account, dashboard renders
tags: [smoke, release]
timeout_seconds: 1200
# A .zip is extracted to <install root>\app. An MSI must support per-user install
# (session users are not local admins): installer_args "ALLUSERS=2 MSIINSTALLPERUSER=1".
setup:
  - tool: reset_app_state
    arguments: { processName: "UatDemo", relativePaths: ["UatDemo"] }
launch:
  executable: "%LOCALAPPDATA%\\UatInstall\\app\\UatDemo.exe"
  arguments: "--uat"
  main_window_timeout_seconds: 90
instructions: |
  Sign in using username "uat.tester" and password "Uat-Test-Only-1" (a non-production test account).
  On the dashboard, open the Reports tab, then export the "Monthly summary" report as PDF to the
  Documents folder. Then open Help > About.
criteria:
  - id: C1
    kind: visual
    description: Sign-in screen shows the product logo, username and password fields and an enabled Sign in button.
  - id: C2
    kind: visual
    description: After sign-in the dashboard shows the user's display name and no error banners, with no clipped or overlapping text at 1280x720.
  - id: C3
    kind: visual
    description: Export completes with a visible success confirmation.
  - id: C4
    kind: deterministic
    description: Main window title carries the release version.
    assertion:
      tool: assert_window_title
      arguments: { expected: "^UAT Demo \\d+\\.\\d+\\.\\d+", comparison: "regex" }
  - id: C5
    kind: deterministic
    description: Status bar reports Connected.
    assertion:
      tool: assert_element
      arguments: { automationId: "StatusBarConnection", property: "name", expected: "Connected", comparison: "equals", timeoutSeconds: 15 }
  - id: C6
    kind: deterministic
    description: The signed-in user's display name is shown.
    assertion:
      tool: assert_element
      arguments: { automationId: "DisplayName", property: "name", expected: "UAT Tester", comparison: "contains" }
explore: true
# The same journey as `instructions`, as exact steps. The agent ignores this; it is
# what drives the app when there is no agent (`uat_harness local`, CI's windows
# job), so the screenshots exist for a person to judge C1-C3 against.
walkthrough:
  - { tool: set_text, arguments: { automationId: UsernameBox, text: uat.tester } }
  - tool: set_text
    arguments: { automationId: PasswordBox, text: Uat-Test-Only-1 }
    capture: sign-in form filled in
  - tool: click_element
    arguments: { automationId: SignInButton }
    capture: dashboard after sign-in
  - tool: click_element
    arguments: { name: Reports, controlType: TabItem }
    capture: reports tab
  - tool: click_element
    arguments: { automationId: ExportButton }
    capture: export confirmation
  - { tool: click_element, arguments: { name: Help, controlType: MenuItem } }
  - tool: click_element
    arguments: { name: About UAT Demo, controlType: MenuItem }
    capture: about dialog
  - { tool: click_element, arguments: { name: OK, windowTitle: About UAT Demo } }
